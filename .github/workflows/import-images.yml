# ფოტოების ერთჯერადი იმპორტი: import/images.json-ის ბმულებიდან ჩამოტვირთავს,
# შეამცირებს, images/-ში ჩაწერს და საიტს ხელახლა ააწყობს.
name: Import images

on:
  push:
    branches: [main]
    paths: ['import/images.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-images
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: ფოტოების ჩამოტვირთვა
        run: python import/fetch_images.py
      - name: შენახვა
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images import/failed.json
          if git diff --cached --quiet; then echo "ახალი ფოტო არ არის"; exit 0; fi
          git commit -m "ფოტოების იმპორტი ($(git diff --cached --name-only -- images | wc -l) ფაილი)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: საიტის განახლება
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
