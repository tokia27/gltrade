name: Temporary photo scan
on:
  push:
    branches: [tmp-photo-scan]
    paths: ['scan.py', '.github/workflows/scan.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan.json
          git commit -m "scan result"
          git push origin HEAD:tmp-photo-scan
